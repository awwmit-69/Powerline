name: Temporary Dart formatting fix
on:
  push:
    branches:
      - fix/live-provider-readiness-20261114
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Format touched Dart files
        working-directory: flutter_app
        run: dart format lib/engines/call/twilio_call_engine.dart lib/engines/messaging/messaging_provider.dart lib/features/dialpad/dialpad_screen.dart
      - name: Commit only formatted source
        run: |
          git config user.name 'PowerLine CI Formatter'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flutter_app/lib/engines/call/twilio_call_engine.dart flutter_app/lib/engines/messaging/messaging_provider.dart flutter_app/lib/features/dialpad/dialpad_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Apply dart format to live-provider readiness fixes'
            git push
          fi
