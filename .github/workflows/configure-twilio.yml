name: Configure existing PowerLine Twilio line
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure owned number and TwiML application
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_API_KEY_SID: ${{ secrets.TWILIO_API_KEY_SID }}
          TWILIO_API_KEY_SECRET: ${{ secrets.TWILIO_API_KEY_SECRET }}
          TWIML_APP_SID: ${{ secrets.TWIML_APP_SID }}
          POWERLINE_FROM_NUMBER: ${{ secrets.POWERLINE_FROM_NUMBER }}
          PUBLIC_ORIGIN: https://powerline.azdglobal.com
        run: node backend/configure-twilio.mjs
