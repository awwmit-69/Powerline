name: Powerline Build

on:
  push:
    branches: [main, codex/production-security]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powerline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Check formatting
        working-directory: flutter_app
        run: |
          dart format lib test integration_test
          git diff --exit-code -- lib test integration_test
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Test
        working-directory: flutter_app
        run: flutter test

  web:
    name: Build web
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Complete web runner
        working-directory: flutter_app
        run: flutter create --platforms=web .
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Build
        working-directory: flutter_app
        run: flutter build web --release --base-href /Powerline/
      - uses: actions/upload-artifact@v4
        with:
          name: Powerline_Web_Build
          path: flutter_app/build/web
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: flutter_app/build/web

  private-web:
    name: Build private web workspace
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Complete web runner
        working-directory: flutter_app
        run: flutter create --platforms=web .
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Build authenticated workspace for custom domain
        working-directory: flutter_app
        run: flutter build web --release --base-href / --dart-define=POWERLINE_PRODUCTION=true
      - uses: actions/upload-artifact@v4
        with:
          name: PowerLine_Private_Web
          path: flutter_app/build/web

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  windows:
    name: Build Windows
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Complete Windows runner
        working-directory: flutter_app
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force windows
          flutter create --platforms=windows .
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Build
        working-directory: flutter_app
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $dir = "flutter_app/build/windows/x64/runner/Release"
          if (!(Test-Path $dir)) {
            $dir = "flutter_app/build/windows/runner/Release"
          }
          Compress-Archive -Path "$dir/*" -DestinationPath Powerline_Windows_Build.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Powerline_Windows_Build
          path: Powerline_Windows_Build.zip
