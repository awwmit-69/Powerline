name: TruuOwner daily Claude marketing drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: truuowner-daily-drafts
  cancel-in-progress: false

jobs:
  draft-marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test marketing generator
        run: python -m unittest discover -s automation -p 'test_*.py'
      - name: Produce marketing drafts with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRUUOWNER_CLAUDE_MODEL: ${{ vars.TRUUOWNER_CLAUDE_MODEL }}
        run: python automation/truuowner_daily.py --out marketing-output
      - name: Save reviewable campaign pack
        uses: actions/upload-artifact@v4
        with:
          name: truuowner-claude-marketing-${{ github.run_number }}
          path: marketing-output/*.md
          if-no-files-found: error
          retention-days: 30
