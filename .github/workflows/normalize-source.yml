name: Normalize Powerline Source

on:
  push:
    branches:
      - agent/normalize-powerline-source

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/normalize-powerline-source
      - name: Expand normalized source
        run: |
          unzip -o powerline-normalized-source.zip
          rm powerline-normalized-source.zip
          rm powerline_src.zip
          rm .github/workflows/normalize-source.yml
      - name: Commit normalized tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Powerline source and enforce CI"
          git push origin HEAD:agent/normalize-powerline-source
