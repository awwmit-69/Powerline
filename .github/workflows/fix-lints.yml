name: Fix Powerline Lints

on:
  push:
    branches:
      - agent/normalize-powerline-source

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/normalize-powerline-source
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Apply safe analyzer fixes
        working-directory: flutter_app
        run: dart fix --apply
      - name: Format fixed source
        working-directory: flutter_app
        run: dart format lib test integration_test
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --quiet || git commit -m "Apply analyzer fixes"
          git push origin HEAD:agent/normalize-powerline-source
