name: Data Agent Test Call

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  call:
    name: Call verified Data Rep test number
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive Twilio account identity
        env:
          API_KEY_SECRET: ${{ secrets.TWILIOPASSWORD }}
          API_VALUE: ${{ secrets.TWILIO_API }}
          FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TEST_NUMBER: ${{ secrets.TWILIO_TEST_NUMBER }}
        run: |
          for key in API_KEY_SECRET API_VALUE FROM_NUMBER TEST_NUMBER; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is not configured"
              exit 1
            fi
          done
          curl --fail --silent --show-error \
            "https://powerline-voice-2020.twil.io/token" > /tmp/token-response
          python3 - <<'PY' >> "$GITHUB_ENV"
          import base64
          import json

          raw = open("/tmp/token-response", encoding="utf-8").read().strip()
          try:
              parsed = json.loads(raw)
              token = parsed.get("token") or parsed.get("accessToken") or raw
          except json.JSONDecodeError:
              token = raw
          token = token.strip().strip('"')
          payload_segment = token.split(".")[1]
          payload_segment += "=" * (-len(payload_segment) % 4)
          payload = json.loads(base64.urlsafe_b64decode(payload_segment))
          account_sid = payload.get("sub")
          api_key_sid = payload.get("iss")
          if not (isinstance(account_sid, str) and account_sid.startswith("AC") and len(account_sid) == 34):
              raise SystemExit("::error::Could not derive the AC-prefixed Account SID from /token")
          if not (isinstance(api_key_sid, str) and api_key_sid.startswith("SK") and len(api_key_sid) == 34):
              raise SystemExit("::error::Could not derive the SK-prefixed API Key SID from /token")
          print(f"ACCOUNT_SID={account_sid}")
          print(f"API_KEY_SID={api_key_sid}")
          PY

      - name: Generate Arpita bb Data Rep audio
        env:
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          key = os.environ.get("ELEVENLABS_KEY", "").strip().strip('"')
          if not key:
              raise SystemExit("::error::ELEVENLABS secret is not configured")
          request = urllib.request.Request(
              "https://api.elevenlabs.io/v1/voices",
              headers={"xi-api-key": key, "Accept": "application/json"},
          )
          with urllib.request.urlopen(request) as response:
              voices = json.load(response).get("voices", [])
          matches = [
              voice for voice in voices
              if "arpita" in str(voice.get("name", "")).lower()
              or "arpa" in str(voice.get("name", "")).lower()
          ]
          if not matches:
              names = ", ".join(sorted(str(v.get("name", "")) for v in voices))
              raise SystemExit(f"::error::Could not find Arpita bb in ElevenLabs. Available voice names: {names}")
          voice_id = matches[0]["voice_id"]
          text = (
              "Hello Amit. This is your PowerLine Data Rep, using Arpita's voice. "
              "You cannot sell if you are targeting the wrong audience. "
              "TruuOwner helps sales teams qualify the right homeowners, protect every cent spent on outreach, "
              "and turn clean records into real conversations. The custom ElevenLabs voice is now connected."
          )
          body = json.dumps({
              "text": text,
              "model_id": "eleven_multilingual_v2",
              "voice_settings": {
                  "stability": 0.55,
                  "similarity_boost": 0.82,
                  "style": 0.25,
                  "use_speaker_boost": True,
              },
          }).encode()
          request = urllib.request.Request(
              f"https://api.elevenlabs.io/v1/text-to-speech/{voice_id}",
              data=body,
              method="POST",
              headers={
                  "xi-api-key": key,
                  "Content-Type": "application/json",
                  "Accept": "audio/mpeg",
              },
          )
          with urllib.request.urlopen(request) as response:
              audio = response.read()
          path = pathlib.Path("voice-assets/arpita-data-agent-test.mp3")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(audio)
          print(f"Generated Arpita bb audio ({len(audio)} bytes)")
          PY

      - name: Publish generated voice asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-assets/arpita-data-agent-test.mp3
          if git diff --cached --quiet; then
            echo "Voice asset already current"
          else
            git commit -m "Generate Arpita bb Data Rep test audio"
            git push
          fi

      - name: Originate Data Rep test call
        env:
          API_KEY_SECRET: ${{ secrets.TWILIOPASSWORD }}
          API_VALUE: ${{ secrets.TWILIO_API }}
          FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TEST_NUMBER: ${{ secrets.TWILIO_TEST_NUMBER }}
        run: |
          API_KEY_SECRET="$(printf '%s' "$API_KEY_SECRET" | tr -d '\r\n\"')"
          API_VALUE="$(printf '%s' "$API_VALUE" | tr -d '\r\n\"')"
          FROM_NUMBER="$(printf '%s' "$FROM_NUMBER" | tr -d '[:space:]\"')"
          TEST_NUMBER="$(printf '%s' "$TEST_NUMBER" | tr -d '[:space:]\"')"
          credentials=(
            "$API_KEY_SID:$API_KEY_SECRET"
            "$API_KEY_SID:$API_VALUE"
            "$ACCOUNT_SID:$API_KEY_SECRET"
            "$ACCOUNT_SID:$API_VALUE"
          )
          for credential in "${credentials[@]}"; do
            response="$(
              curl --silent --show-error \
                --user "$credential" \
                --request POST \
                "https://api.twilio.com/2010-04-01/Accounts/$ACCOUNT_SID/Calls.json" \
                --data-urlencode "From=$FROM_NUMBER" \
                --data-urlencode "To=$TEST_NUMBER" \
                --data-urlencode 'Twiml=<Response><Play>https://raw.githubusercontent.com/awwmit-69/Powerline/main/voice-assets/arpita-data-agent-test.mp3?run=${{ github.run_id }}</Play></Response>'
            )"
            if RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys
          payload = json.loads(os.environ["RESPONSE"])
          if payload.get("sid"):
              print(f"Call accepted: {payload['sid']} ({payload.get('status', 'queued')})")
              sys.exit(0)
          sys.exit(1)
          PY
            then
              exit 0
            fi
          done
          echo "::error::Twilio rejected every configured API credential without exposing secret values"
          exit 1
