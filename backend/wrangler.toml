name = "powerline-api"
main = "worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[assets]
directory = "../flutter_app/build/web"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "powerline-db"
database_id = "4c0d2b7c-66f0-465e-a00f-364356de6c19"
migrations_dir = "migrations"

[vars]
TELECOM_ENABLED = "false"
AUTH_MODE = "password"
WEBHOOK_EDGE_READY = "false"
PUBLIC_ORIGIN = "https://powerline.azdglobal.com"
# AUTH_PEPPER must be a Worker secret, never committed here.
# Bind a dedicated DB to schema.sql; never reuse the AZD Global website database.
# Provider credentials belong in Worker secrets, never in this file.
