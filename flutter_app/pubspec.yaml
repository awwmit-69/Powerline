name: powerline
description: "Powerline - cross-platform cloud communications workspace (AZD Global Enterprises Inc.). Demo mode requires no telecom credentials."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  intl: ^0.19.0
  uuid: ^4.5.1
  csv: ^6.0.0
  audioplayers: ^6.1.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  web_socket_channel: ^3.0.1
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-var.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-var.ttf
